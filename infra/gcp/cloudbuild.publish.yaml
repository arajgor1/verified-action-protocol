# Publication of a validated release, in one bounded sequence. Nothing is overwritten: a target
# that already holds identical content is skipped, a target that holds different content stops
# the build. _DRY_RUN=1 (the default) runs every check and copies the image only to
# _DRYRUN_IMAGE_DST; it reads no secret and publishes nothing.
#
# Real mode reads two Secret Manager secret versions, named by the operator at dispatch time:
#   _GITHUB_SECRET  a GitHub token that may push to _GITHUB_REPO, create its releases and write
#                   packages to ghcr.io
#   _NPM_SECRET     an npm access token that may publish the @verified-action-protocol packages
# Neither value is printed; both files are removed at the end of the build.
substitutions:
  _RUN_ID: manual
  _COMMIT_SHA: unknown
  _EVIDENCE_BUCKET: set-by-operator
  _DRY_RUN: "1"
  _IMAGE: set-by-operator
  _PACKAGES: set-by-operator
  _GITHUB_REPO: verified-action-protocol/vap
  _IMAGE_DST: ghcr.io/verified-action-protocol/vap
  _DRYRUN_IMAGE_DST: ""
  _GITHUB_SECRET: ""
  _NPM_SECRET: ""
  _VERSION: 0.1.0-rc.1
  _EXPECTED_DIGEST: sha256:d79c04bd44775e65750fe909f3194ca74ef9c796f10e8995aedb6a9d2c864849
  _NODE: node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
  _GCLOUD: gcr.io/google.com/cloudsdktool/google-cloud-cli:563.0.0-slim@sha256:fa5e64b16a2ec1679c7c08a69b3ca8a588d3b042b602b69667f4d30eb49f2bcf

options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - VAP_CLOUD_EXECUTION=1
    - VAP_PRIVATE_LITERALS=${PROJECT_ID},${PROJECT_NUMBER}
    - VAP_RUN_ID=${_RUN_ID}
    - DRY_RUN=${_DRY_RUN}
    - VERSION=${_VERSION}
    - TAG=v${_VERSION}
    - REPO=${_GITHUB_REPO}
    - SCOPE=@verified-action-protocol
    - PKGS=protocol core store-postgres adapters sdk

timeout: 2400s
tags: ["vap", "vap-publish", "run-${_RUN_ID}"]

steps:
  - id: fetch
    name: ${_GCLOUD}
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        mkdir -p reports assets
        test -f history.bundle || { echo "history bundle missing; run via vap-cloud.sh publish"; exit 1; }
        gcloud storage cp "${_PACKAGES}/SHA256SUMS" "${_PACKAGES}/verified-action-protocol-*-$$VERSION.tgz" "${_PACKAGES}/vap-schemas-0.1.tar.gz" "${_PACKAGES}/public-sbom-runtime.cdx.json" assets/ >/dev/null
        cd assets
        grep -E ' (verified-action-protocol-[a-z-]+-[0-9a-z.-]+\.tgz|vap-schemas-0\.1\.tar\.gz|public-sbom-runtime\.cdx\.json)$' SHA256SUMS > RELEASE-SHA256SUMS
        test "$$(wc -l < RELEASE-SHA256SUMS)" = 7
        sha256sum -c RELEASE-SHA256SUMS | tee ../reports/asset-checksums.txt
        rm SHA256SUMS
        cd ..
        if [ "$$DRY_RUN" != 1 ]; then
          mkdir -p .secrets && chmod 700 .secrets
          ( umask 077
            gcloud secrets versions access "${_GITHUB_SECRET}" > .secrets/github
            gcloud secrets versions access "${_NPM_SECRET}" > .secrets/npm )
          test -s .secrets/github && test -s .secrets/npm
          echo "tokens read from Secret Manager (not printed)"
        fi

  - id: preflight
    name: ${_NODE}
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        git clone -q --mirror history.bundle /workspace/history.git
        G="git -C /workspace/history.git"
        test "$$($$G rev-parse '${_COMMIT_SHA}^{commit}')" = "${_COMMIT_SHA}" || { echo "release commit not in the bundle" >&2; exit 1; }
        echo "release commit ${_COMMIT_SHA}; $$($$G rev-list --count ${_COMMIT_SHA}) commits in its history" | tee reports/plan.txt
        # The whole history that becomes public must be free of private identifiers.
        (cd /workspace/history.git && node /workspace/scripts/release-hygiene.mjs --history) | tail -3 | tee reports/history-hygiene.txt
        AUTH=(); [ "$$DRY_RUN" = 1 ] || AUTH=(-H "Authorization: Bearer $$(cat .secrets/github)")
        api() { curl -sS -o /tmp/api.json -w '%{http_code}' "$${AUTH[@]}" -H 'Accept: application/vnd.github+json' "https://api.github.com$$1"; }
        code=$$(api "/repos/$$REPO")
        echo "github repository $$REPO: HTTP $$code" | tee -a reports/plan.txt
        if [ "$$code" = 200 ]; then
          node -e 'const r=require("/tmp/api.json"); console.log(`  visibility ${r.visibility}, default branch ${r.default_branch}`)' | tee -a reports/plan.txt
          remote=$$(git ls-remote "https://github.com/$$REPO.git" "refs/tags/$$TAG" | cut -f1)
          if [ -n "$$remote" ] && [ "$$remote" != "${_COMMIT_SHA}" ]; then echo "tag $$TAG exists at $$remote; refusing to overwrite" >&2; exit 1; fi
          echo "  tag $$TAG: $${remote:-absent}" | tee -a reports/plan.txt
        elif [ "$$DRY_RUN" != 1 ]; then echo "repository $$REPO does not exist or the token cannot see it" >&2; exit 1; fi
        : > reports/npm-plan.txt
        for p in $$PKGS; do
          f="assets/verified-action-protocol-$$p-$$VERSION.tgz"
          want="sha512-$$(openssl dgst -sha512 -binary "$$f" | base64 -w0)"
          have=$$(npm view "$$SCOPE/$$p@$$VERSION" dist.integrity 2>/dev/null || true)
          if [ -z "$$have" ]; then echo "$$p publish" >> reports/npm-plan.txt
          elif [ "$$have" = "$$want" ]; then echo "$$p skip-identical" >> reports/npm-plan.txt
          else echo "$$SCOPE/$$p@$$VERSION exists with different content; refusing to overwrite" >&2; exit 1; fi
        done
        sed 's/^/  npm /' reports/npm-plan.txt | tee -a reports/plan.txt
        if [ "$$DRY_RUN" != 1 ]; then
          printf '//registry.npmjs.org/:_authToken=%s\n' "$$(cat .secrets/npm)" > .secrets/npmrc
          npm whoami --userconfig .secrets/npmrc >/dev/null
          npm org ls verified-action-protocol --userconfig .secrets/npmrc >/dev/null
          echo "  npm token can act for the verified-action-protocol organization" | tee -a reports/plan.txt
        fi

  - id: image
    name: ${_NODE}
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get -qq update >/dev/null && apt-get -qq install -y --no-install-recommends skopeo >/dev/null
        skopeo --version | tee reports/skopeo-version.txt
        tok=$$(curl -sS -H 'Metadata-Flavor: Google' http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token | node -pe 'JSON.parse(require("fs").readFileSync(0)).access_token')
        src="${_IMAGE}"; case "$$src" in *@${_EXPECTED_DIGEST}) ;; *) echo "source is not the accepted digest" >&2; exit 1 ;; esac
        if [ "$$DRY_RUN" = 1 ]; then
          [ -n "${_DRYRUN_IMAGE_DST}" ] || { echo "dry run: no image copy target; skipped"; exit 0; }
          dst="${_DRYRUN_IMAGE_DST}:$$VERSION"; dcred="oauth2accesstoken:$$tok"
        else
          dst="${_IMAGE_DST}:$$VERSION"
          login=$$(curl -sS -H "Authorization: Bearer $$(cat .secrets/github)" https://api.github.com/user | node -pe 'JSON.parse(require("fs").readFileSync(0)).login')
          dcred="$$login:$$(cat .secrets/github)"
          existing=$$(skopeo inspect --raw --creds "$$dcred" "docker://$$dst" 2>/dev/null | sha256sum | cut -d' ' -f1 || true)
          if skopeo inspect --raw --creds "$$dcred" "docker://$$dst" >/dev/null 2>&1; then
            [ "sha256:$$existing" = "${_EXPECTED_DIGEST}" ] || { echo "$$dst exists with another digest; refusing to overwrite" >&2; exit 1; }
            echo "image $$dst already holds ${_EXPECTED_DIGEST}; skipped" | tee reports/image.txt; exit 0
          fi
        fi
        skopeo copy --quiet --preserve-digests --src-creds "oauth2accesstoken:$$tok" --dest-creds "$$dcred" "docker://$$src" "docker://$$dst"
        got="sha256:$$(skopeo inspect --raw --creds "$$dcred" "docker://$$dst" | sha256sum | cut -d' ' -f1)"
        test "$$got" = "${_EXPECTED_DIGEST}" || { echo "copied digest $$got differs from ${_EXPECTED_DIGEST}" >&2; exit 1; }
        shown="$${dst%%:*}"; [ "$$DRY_RUN" = 1 ] && shown="<dry-run target>"
        echo "image copied to $$shown with digest $$got (tag $$VERSION)" | tee reports/image.txt

  - id: source
    name: ${_NODE}
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        [ "$$DRY_RUN" = 1 ] && { echo "dry run: would push ${_COMMIT_SHA} as refs/heads/main and refs/tags/$$TAG to $$REPO"; exit 0; }
        G="git -C /workspace/history.git"
        hdr="Authorization: Basic $$(printf 'x-access-token:%s' "$$(cat .secrets/github)" | base64 -w0)"
        $$G -c "http.extraHeader=$$hdr" push "https://github.com/$$REPO.git" "${_COMMIT_SHA}:refs/heads/main" "${_COMMIT_SHA}:refs/tags/$$TAG"
        echo "pushed main and $$TAG at ${_COMMIT_SHA}" | tee reports/source.txt

  - id: npm
    name: ${_NODE}
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        [ "$$DRY_RUN" = 1 ] && { echo "dry run: would publish $$(grep -c ' publish$$' reports/npm-plan.txt || true) packages with --tag next --access public"; exit 0; }
        while read -r p action; do
          [ "$$action" = publish ] || { echo "$$SCOPE/$$p@$$VERSION identical; skipped"; continue; }
          npm publish "assets/verified-action-protocol-$$p-$$VERSION.tgz" --access public --tag next --userconfig .secrets/npmrc
        done < reports/npm-plan.txt
        for p in $$PKGS; do echo "$$SCOPE/$$p@$$VERSION $$(npm view "$$SCOPE/$$p@$$VERSION" dist.integrity)"; done | tee reports/npm-published.txt

  - id: release
    name: ${_NODE}
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        [ "$$DRY_RUN" = 1 ] && { echo "dry run: would create prerelease $$TAG on $$REPO with: $$(cd assets && ls | tr '\n' ' ')"; exit 0; }
        H=(-H "Authorization: Bearer $$(cat .secrets/github)" -H 'Accept: application/vnd.github+json')
        code=$$(curl -sS -o /tmp/rel.json -w '%{http_code}' "$${H[@]}" "https://api.github.com/repos/$$REPO/releases/tags/$$TAG")
        if [ "$$code" = 404 ]; then
          node -e 'const fs=require("fs"); fs.writeFileSync("/tmp/new.json", JSON.stringify({tag_name: process.env.TAG, name: "VAP " + process.env.VERSION + " (experimental)", prerelease: true, body: fs.readFileSync("docs/release-notes-0.1.0-rc.1.md", "utf8")}))'
          curl -sS -f -o /tmp/rel.json "$${H[@]}" -X POST "https://api.github.com/repos/$$REPO/releases" --data-binary @/tmp/new.json
        fi
        id=$$(node -pe 'require("/tmp/rel.json").id')
        have=$$(node -pe 'require("/tmp/rel.json").assets.map(a => a.name).join(" ")')
        for f in assets/*; do
          n=$$(basename "$$f")
          case " $$have " in *" $$n "*) echo "asset $$n present; skipped"; continue ;; esac
          curl -sS -f -o /dev/null "$${H[@]}" -H 'Content-Type: application/octet-stream' --data-binary @"$$f" "https://uploads.github.com/repos/$$REPO/releases/$$id/assets?name=$$n"
          echo "uploaded $$n"
        done | tee reports/release.txt
        node -pe '"release " + require("/tmp/rel.json").html_url' | tee -a reports/release.txt

  - id: forget-tokens
    name: ${_NODE}
    entrypoint: bash
    args: ["-c", "set -e; rm -rf .secrets /workspace/history.git; echo 'token files removed'"]

artifacts:
  objects:
    location: gs://${_EVIDENCE_BUCKET}/publish/${_RUN_ID}/
    paths: ["reports/*"]
