# Fresh-environment check of the two README paths, exactly as a user runs them: Docker Compose on
# a clean Docker host, from the repository files only. Nothing in the monorepo is installed or
# built. Mode `public` (no _IMAGE, no _PACKAGES) pulls the published image and installs the SDK
# from the npm registry. Mode `prepublication` points the same commands at the release image by
# digest and at the release's npm tarballs (checked against its SHA256SUMS) instead.
substitutions:
  _RUN_ID: manual
  _COMMIT_SHA: unknown
  _EVIDENCE_BUCKET: set-by-operator
  _IMAGE: ""
  _PACKAGES: ""
  _EXPECTED_DIGEST: sha256:d79c04bd44775e65750fe909f3194ca74ef9c796f10e8995aedb6a9d2c864849
  _DOCKER: gcr.io/cloud-builders/docker@sha256:0aca0f95e1ba8f9107263d3e9782d5ce99a5b60d35b3f8985e4534b65552636f
  _GCLOUD: gcr.io/google.com/cloudsdktool/google-cloud-cli:563.0.0-slim@sha256:fa5e64b16a2ec1679c7c08a69b3ca8a588d3b042b602b69667f4d30eb49f2bcf

options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - VAP_CLOUD_EXECUTION=1
    - VAP_RUN_ID=${_RUN_ID}
    - COMMIT_SHA=${_COMMIT_SHA}

timeout: 1500s
tags: ["vap", "vap-quickstart", "run-${_RUN_ID}"]

steps:
  - id: packages
    name: ${_GCLOUD}
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        mkdir -p reports tarballs
        if [ -z "${_PACKAGES}" ]; then echo "mode: public (npm registry and published image)" | tee reports/mode.txt; exit 0; fi
        echo "mode: prepublication (release tarballs and release image by digest)" | tee reports/mode.txt
        gcloud storage cp "${_PACKAGES}/SHA256SUMS" "${_PACKAGES}/verified-action-protocol-*-0.1.0-rc.1.tgz" tarballs/ >/dev/null
        cd tarballs && grep -E ' verified-action-protocol-[a-z-]+-0\.1\.0-rc\.1\.tgz$' SHA256SUMS | sha256sum -c - | tee ../reports/package-checksums.txt

  - id: try-vap
    name: ${_DOCKER}
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ -n "${_IMAGE}" ]; then export VAP_IMAGE="${_IMAGE}"; fi
        C="docker compose -f examples/quickstart/compose.yaml"
        # The private release path ends in /vap, the published one in /verified-action-protocol.
        ref=$$($$C config --images | grep -E '/(vap|verified-action-protocol)@sha256:' | sort -u)
        case "$$ref" in *@${_EXPECTED_DIGEST}) ;; *) echo "compose image $$ref is not the accepted digest" >&2; exit 1 ;; esac
        docker pull -q "$$ref" >/dev/null
        docker image inspect "$$ref" --format 'image {{index .RepoDigests 0}} revision {{index .Config.Labels "org.opencontainers.image.revision"}} user {{.Config.User}}' | tee reports/image.txt
        # The README command, unchanged.
        $$C run --rm demo | tee reports/demo-output.txt
        grep -q "summary: dropped response reconciled to verified with exactly one destination write" reports/demo-output.txt
        grep -q "2a. Dropped response" reports/demo-output.txt
        # The running VAP containers follow the deployment restrictions.
        for s in api worker fixture; do
          c=$$($$C ps -q $$s)
          docker inspect "$$c" --format "$$s user={{.Config.User}} privileged={{.HostConfig.Privileged}} capdrop={{.HostConfig.CapDrop}} capadd={{.HostConfig.CapAdd}} securityopt={{.HostConfig.SecurityOpt}} devices={{len .HostConfig.Devices}}" | tee -a reports/hardening.txt
          docker exec "$$c" sh -c 'echo "  uid=$$(id -u) $$(grep -E "^(CapEff|NoNewPrivs)" /proc/self/status | tr "\t\n" "  ")"' | tee -a reports/hardening.txt
        done
        grep -q "privileged=true" reports/hardening.txt && exit 1
        test "$$(grep -c 'uid=1000 CapEff: 0000000000000000 NoNewPrivs: 1' reports/hardening.txt)" = 3

  - id: connect
    name: ${_DOCKER}
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ -n "${_IMAGE}" ]; then export VAP_IMAGE="${_IMAGE}"; fi
        F="-f examples/quickstart/compose.yaml"
        if [ -n "${_PACKAGES}" ]; then
          # Same container and example; the SDK comes from the release tarballs instead of npm.
          printf '%s\n' 'services:' '  connect:' '    volumes:' '      - /workspace/tarballs:/tarballs:ro' \
            '    command: ["sh", "-c", "cp -r /src/. /tmp/app && cd /tmp/app && npm install --no-audit --no-fund --loglevel=error /tarballs/verified-action-protocol-protocol-0.1.0-rc.1.tgz /tarballs/verified-action-protocol-core-0.1.0-rc.1.tgz /tarballs/verified-action-protocol-sdk-0.1.0-rc.1.tgz && npm ls --all @verified-action-protocol/sdk && node index.mjs"]' > /workspace/connect-prepublication.yaml
          F="$$F -f /workspace/connect-prepublication.yaml"
        fi
        docker compose $$F run --rm connect | tee reports/connect-output.txt
        grep -q "^verified: " reports/connect-output.txt

  - id: cleanup
    name: ${_DOCKER}
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        C="docker compose -f examples/quickstart/compose.yaml"
        $$C logs --no-color > reports/compose-logs.txt 2>&1 || true
        $$C down -v --remove-orphans
        L=label=com.docker.compose.project=vap-quickstart
        left="$$(docker ps -aq --filter $$L) $$(docker volume ls -q --filter $$L) $$(docker network ls -q --filter $$L)"
        if [ -n "$$(echo "$$left" | tr -d ' ')" ]; then echo "cleanup left resources behind" >&2; exit 1; fi
        echo "cleanup: no container, network or volume of project vap-quickstart remains" | tee reports/cleanup.txt

artifacts:
  objects:
    location: gs://${_EVIDENCE_BUCKET}/quickstart/${_RUN_ID}/
    paths: ["reports/*"]
