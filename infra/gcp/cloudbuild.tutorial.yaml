# Custom-action tutorial in the cloud: disposable PostgreSQL, the synthetic issue tracker and a
# VAP runtime loaded with the adapter configuration you committed, then the tutorial's requests
# (grant, task, plan, operation, receipt, outcome, replay). No persistent resources.
#
#   bash scripts/vap-cloud.sh tutorial [--config examples/config/adapters.tutorial.json]
substitutions:
  _RUN_ID: manual
  _COMMIT_SHA: unknown
  _CONFIG: examples/config/adapters.tutorial.json
  _EVIDENCE_BUCKET: set-by-operator
  _NODE: node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
  _POSTGRES: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
  _DOCKER: gcr.io/cloud-builders/docker@sha256:0aca0f95e1ba8f9107263d3e9782d5ce99a5b60d35b3f8985e4534b65552636f

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  env:
    - VAP_CLOUD_EXECUTION=1
    - VAP_PRIVATE_LITERALS=${PROJECT_ID},${PROJECT_NUMBER}
    - VAP_RUN_ID=${_RUN_ID}
    - COMMIT_SHA=${_COMMIT_SHA}
    - NPM_CONFIG_UPDATE_NOTIFIER=false

timeout: 1200s
tags: ["vap", "vap-tutorial", "run-${_RUN_ID}"]

steps:
  - id: source-hygiene
    name: ${_NODE}
    entrypoint: node
    args: ["scripts/release-hygiene.mjs", "--tree", "."]
  - id: postgres
    name: ${_DOCKER}
    args: ["run", "-d", "--network=cloudbuild", "--name=vap-pg", "--label=vap-run=${_RUN_ID}", "-e", "POSTGRES_HOST_AUTH_METHOD=trust", "${_POSTGRES}"]
  - id: install-build
    name: ${_NODE}
    entrypoint: bash
    args: ["-c", "npm ci --ignore-scripts && npm run build"]
  - id: wait-postgres
    name: ${_POSTGRES}
    entrypoint: bash
    args: ["-c", "for i in $$(seq 1 60); do pg_isready -h vap-pg -U postgres && exit 0; sleep 1; done; exit 1"]
  - id: tutorial
    name: ${_NODE}
    entrypoint: bash
    env: ["VAP_TEST_ADMIN_URL=postgres://postgres@vap-pg:5432/postgres", "TUTORIAL_CONFIG=${_CONFIG}"]
    args: ["-c", "set -eo pipefail; mkdir -p reports; node scripts/tutorial-run.ts --config \"$$TUTORIAL_CONFIG\" --out reports 2>&1 | tee reports/tutorial.log"]
  - id: evidence
    name: ${_NODE}
    entrypoint: node
    env: ["BUILD_ID=$BUILD_ID", "VAP_SUITE=tutorial"]
    args: ["scripts/evidence.mjs", "reports"]
  - id: teardown
    name: ${_DOCKER}
    entrypoint: bash
    args: ["-c", "docker rm -f vap-pg >/dev/null 2>&1 || true"]

artifacts:
  objects:
    location: gs://${_EVIDENCE_BUCKET}/tutorial/${_RUN_ID}/
    paths: ["reports/*"]
